# Build the NSIS Windows installer and attach it to a GitHub Release.
# Create a release by bumping version in package.json, then:
#   git add package.json package-lock.json && git commit -m "Release v0.x.x"
#   git tag v0.x.x && git push origin main && git push origin v0.x.x

name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and test
        run: npm ci

      - run: npm test

      - name: Build Vite + Electron (NSIS)
        run: npm run electron:build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
